<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TransMate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon32.png" width="32" height="32" alt="" />
        <div><h1>TransMate</h1><p>外贸沟通助手 · 作者 Mark</p></div>
      <button id="openSettings" class="icon-button" title="打开设置" aria-label="打开设置">⚙</button>
    </header>

    <section class="feature-card">
      <div class="feature-heading">
        <div><span class="eyebrow">翻译</span><strong>商务多语互译</strong></div>
        <span id="translationBadge" class="badge">—</span>
      </div>
      <div class="trigger">连续按 <b id="count">3</b> 次空格</div>
        <div class="meta"><span id="direction">自动判断翻译方向</span><span id="providerName">—</span></div>
      <div class="meta"><span>当前网站</span><span id="host">—</span></div>
      <button id="siteToggle" class="subtle" type="button">—</button>
      <div id="apiWarning" class="warning" hidden>尚未配置当前翻译服务</div>
    </section>

    <section class="feature-card whatsapp-card">
      <div class="feature-heading">
        <div><span class="eyebrow green">WHATSAPP</span><strong>客户当地时间</strong></div>
        <label class="switch"><input id="watEnabled" type="checkbox" /><span></span></label>
      </div>
      <div id="contactName" class="contact-name">请打开一个 WhatsApp 对话</div>
      <div id="timeSummary" class="time-summary">等待识别</div>
      <div id="timezoneMeta" class="timezone-meta">号码归属地区与当地时间</div>
      <label class="language-control">
        <span>默认翻译语言</span>
        <select id="customerLanguage">
          <option value="auto">自动识别</option>
          <option value="en">英语</option><option value="es">西班牙语</option>
          <option value="fr">法语</option><option value="de">德语</option>
          <option value="pt">葡萄牙语</option><option value="ru">俄语</option>
          <option value="uk">乌克兰语</option><option value="lv">拉脱维亚语</option>
          <option value="lt">立陶宛语</option><option value="et">爱沙尼亚语</option>
          <option value="ar">阿拉伯语</option><option value="it">意大利语</option>
          <option value="fa">波斯语</option><option value="he">希伯来语</option>
          <option value="nl">荷兰语</option><option value="pl">波兰语</option>
          <option value="cs">捷克语</option><option value="ro">罗马尼亚语</option>
          <option value="bg">保加利亚语</option><option value="sr">塞尔维亚语</option>
          <option value="hr">克罗地亚语</option><option value="sk">斯洛伐克语</option>
          <option value="sl">斯洛文尼亚语</option><option value="hu">匈牙利语</option>
          <option value="el">希腊语</option><option value="sv">瑞典语</option>
          <option value="da">丹麦语</option><option value="fi">芬兰语</option>
          <option value="no">挪威语</option><option value="ur">乌尔都语</option>
          <option value="tr">土耳其语</option><option value="id">印度尼西亚语</option>
          <option value="ms">马来语</option><option value="tl">菲律宾语</option>
          <option value="vi">越南语</option><option value="th">泰语</option>
          <option value="hi">印地语</option><option value="bn">孟加拉语</option><option value="ta">泰米尔语</option>
          <option value="ja">日语</option><option value="ko">韩语</option>
          <option value="sw">斯瓦希里语</option><option value="ne">尼泊尔语</option><option value="mr">马拉地语</option>
          <option value="am">阿姆哈拉语</option><option value="ka">格鲁吉亚语</option><option value="hy">亚美尼亚语</option>
          <option value="km">高棉语</option><option value="lo">老挝语</option><option value="my">缅甸语</option>
          <option value="si">僧伽罗语</option><option value="gu">古吉拉特语</option><option value="pa">旁遮普语</option>
          <option value="te">泰卢固语</option><option value="kn">卡纳达语</option><option value="ml">马拉雅拉姆语</option>
          <option value="ps">普什图语</option><option value="ug">维吾尔语</option><option value="ca">加泰罗尼亚语</option>
          <option value="af">南非荷兰语</option><option value="as">阿萨姆语</option>
        </select>
      </label>
      <label class="quick-toggle">
        <span><b>允许聊天翻译快捷键</b><small>按一次显示，再按一次关闭 · <kbd id="chatShortcutLabel">Alt+Q</kbd></small></span>
        <span class="switch"><input id="watChatTranslationEnabled" type="checkbox" /><span></span></span>
      </label>
    </section>

    <button id="settings" class="primary" type="button">翻译服务、聊天样式与外观设置</button>
  </main>
  <script src="providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
